<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="pvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="pvRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="needleNorth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="needleSouth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#pvBg)" />
  <circle cx="32" cy="32" r="24" stroke="url(#pvRing)" stroke-width="2.5" stroke-dasharray="3 3" opacity="0.7" />
  <circle cx="32" cy="32" r="28" stroke="#14b8a6" stroke-width="1.5" opacity="0.3" />
  <!-- Cardinal points -->
  <line x1="32" y1="9" x2="32" y2="13" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="51" x2="32" y2="55" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" />
  <line x1="9" y1="32" x2="13" y2="32" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" />
  <line x1="51" y1="32" x2="55" y2="32" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" />
  <!-- Compass Needle -->
  <polygon points="32,15 37,32 32,29 27,32" fill="url(#needleNorth)" />
  <polygon points="32,49 37,32 32,35 27,32" fill="url(#needleSouth)" />
  <!-- Center Pivot Core -->
  <circle cx="32" cy="32" r="3.5" fill="#f8fafc" />
  <circle cx="32" cy="32" r="1.5" fill="#0f172a" />
</svg>
